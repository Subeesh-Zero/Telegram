<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Our Official Community</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Telegram Theme Background */
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Perfect Logo Container */
        .logo-container {
            width: 135px;
            height: 135px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            border: 4px solid #0088cc;
            overflow: hidden; /* Clips out white padding around image */
            box-shadow: 0 8px 20px rgba(0, 136, 204, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0088cc;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            /* Scaled up to perfectly fill the ring with zero gaps */
            transform: scale(1.22); 
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .join-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background-color: #0088cc;
            color: #ffffff;
            text-decoration: none;
            padding: 16px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }

        .join-btn:hover {
            background-color: #0077b3;
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.4);
            transform: translateY(-2px);
        }

        .join-btn:active {
            transform: translateY(1px);
        }

        /* SVG Telegram Icon */
        .telegram-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo Section -->
        <div class="logo-container">
            <img src="https://i.ibb.co/BH7ydRdd/Picsart-26-09-28-12-54-40-306.png" alt="Chutti Vibes Logo">
        </div>
        
        <h1>Join Our Community</h1>
        <p>Stay connected with us! Get the latest updates, announcements, and exclusive content directly on Telegram.</p>
        
        <!-- Telegram Deep Link -->
        <a href="tg:resolve?domain=chuttivibes" class="join-btn">
            <svg class="telegram-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
            </svg>
            Join Channel
        </a>
    </div>

</body>
</html>
